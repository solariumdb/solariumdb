name: Windows

# On demand only: the repository is private, so Windows runner minutes count against the plan.
on:
  workflow_dispatch:

jobs:
  test:
    # The default storage environment on Windows, which enforces file share modes and has no
    # directory fsync; io_uring does not exist there.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build --blame-hang-timeout 5m --blame-hang-dump-type none
