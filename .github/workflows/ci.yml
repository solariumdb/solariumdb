name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Linux, so the io_uring storage environment runs next to the default one.
    runs-on: ubuntu-latest
    # The suite takes about a minute; a hang must not hold the runner for six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Show the kernel
        run: |
          uname -srm
          ulimit -l

      - name: Build
        run: dotnet build -c Release

      - name: Test
        # A test that hangs is stopped after 5 minutes: the log names it, and a mini dump keeps the stacks of the
        # threads, which show a blocked call of the engine. The dump has no heap, so it does not show an async method
        # that waits without a thread; a full dump does, at gigabytes for each process.
        run: dotnet test -c Release --no-build --logger trx --results-directory TestResults --blame-hang-timeout 5m --blame-hang-dump-type mini

      # The packages are built on every run and kept as an artifact; publishing them is a manual step.
      - name: Pack
        run: dotnet pack -c Release --no-build -o packages

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/*.nupkg

      # Fails the job when io_uring did not run: without it the suite is still green.
      - name: Summarize
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/test-summary.py TestResults

      # What a failed run leaves: the results, the sequence of the tests of a stopped run, and the dumps of a hang.
      # Anyone can download the artifacts of a public repository, and a dump holds the environment of the test
      # process, so no secret may be in the environment of the Test step.
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 7
